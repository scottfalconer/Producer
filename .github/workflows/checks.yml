name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r producer/requirements.txt ruff==0.15.10
      - run: python -m ruff check --select F producer
      - run: PYTHONPATH=producer python -m unittest discover -s producer -p 'test_*.py' -v
      - run: npm ci --prefix producer
      - run: npx --prefix producer playwright install --with-deps chrome
      - run: node producer/native-obs-browser-check.cjs
      - run: node producer/realtime-browser-check.cjs
      - run: node producer/simulated-chat-csp-browser-check.cjs
